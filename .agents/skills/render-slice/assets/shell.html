<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IMPORT — slice</title>
    <style>
      /*FONTS*/
      :root {
        --paper: #f5f5f5;
        --paper2: #ececec;
        --white: #fff;
        --ink: #2d3142;
        --muted: #4f5d75;
        --soft: #7a8399;
        --rule: rgba(45, 49, 66, 0.12);
        --rule2: #bfc0c0;
        --accent: #eb6c36;
        --accent-t: rgba(235, 108, 54, 0.06);
        --sans: "Geist", system-ui, sans-serif;
        --serif: "Instrument Serif", Georgia, serif;
        --mono: "Geist Mono", ui-monospace, Menlo, monospace;
        --rail: 248px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        min-height: 100vh;
      }
      body.collapsed {
        --rail: 56px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--soft);
      }

      /* rail */
      #rail {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--white);
        border-right: 1px solid var(--rule);
        padding: 20px 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #rail nav {
        overflow-y: auto;
        flex: 1;
        margin-top: 16px;
      }
      #rail nav::-webkit-scrollbar {
        display: none;
      }
      #rail nav {
        scrollbar-width: none;
      }
      .top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 4px;
      }
      .top h1 {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 400;
        flex: 1;
        line-height: 1;
        white-space: nowrap;
        overflow: hidden;
      }
      #grip {
        background: none;
        border: 0;
        padding: 6px;
        cursor: pointer;
        color: var(--soft);
        border-radius: 4px;
        line-height: 0;
      }
      #grip:hover {
        background: var(--paper2);
        color: var(--ink);
      }
      body.collapsed #grip svg {
        transform: rotate(180deg);
      }
      body.collapsed .top h1,
      body.collapsed .lbl,
      body.collapsed .grp,
      body.collapsed .foot {
        display: none;
      }
      body.collapsed #rail {
        padding: 20px 8px;
        align-items: center;
      }
      body.collapsed nav button {
        justify-content: center;
        width: 40px;
        padding: 9px 0;
      }
      .grp {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--soft);
        padding: 16px 8px 6px;
      }
      .grp:first-child {
        padding-top: 0;
      }
      nav button {
        display: flex;
        align-items: center;
        gap: 9px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        padding: 7px 8px;
        border-radius: 5px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        color: var(--muted);
      }
      nav button:hover {
        background: var(--paper2);
        color: var(--ink);
      }
      nav button[aria-current="true"] {
        background: var(--accent-t);
        color: var(--accent);
        font-weight: 500;
      }
      nav .n {
        font-family: var(--mono);
        font-size: 10px;
        opacity: 0.65;
        width: 14px;
        flex: none;
      }
      .lbl {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .foot {
        padding: 12px 8px 0;
        border-top: 1px solid var(--rule);
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.06em;
        color: var(--soft);
        line-height: 1.8;
      }

      /* content */
      main {
        min-width: 0;
        padding: 40px 44px 96px;
        max-width: 1160px;
      }
      section {
        display: none;
      }
      section.on {
        display: block;
      }
      h2 {
        font-family: var(--serif);
        font-size: 32px;
        font-weight: 400;
        line-height: 1.1;
        margin: 4px 0 8px;
      }
      .sub {
        color: var(--muted);
        max-width: 66ch;
        margin-bottom: 28px;
        font-size: 14px;
      }
      h3 {
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--soft);
        margin: 40px 0 12px;
      }
      p {
        max-width: 74ch;
      }
      svg.d {
        width: 100%;
        height: auto;
        display: block;
      }
      figcaption {
        margin-top: 14px;
        font-size: 12.5px;
        color: var(--soft);
        max-width: 70ch;
      }
      .scroll {
        overflow-x: auto;
      }
      .scroll svg.d {
        min-width: 1040px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th {
        text-align: left;
        font-family: var(--mono);
        font-size: 8px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--soft);
        font-weight: 500;
        padding: 0 14px 8px 0;
        border-bottom: 1px solid var(--rule2);
      }
      td {
        padding: 11px 14px 11px 0;
        border-bottom: 1px solid var(--rule);
        vertical-align: top;
        color: var(--muted);
      }
      td:first-child {
        color: var(--ink);
        font-weight: 500;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      code {
        font-family: var(--mono);
        font-size: 0.88em;
        color: var(--ink);
      }

      ul.l {
        list-style: none;
      }
      ul.l li {
        padding: 12px 0;
        border-bottom: 1px solid var(--rule);
        max-width: 80ch;
        color: var(--muted);
      }
      ul.l li:last-child {
        border-bottom: 0;
      }
      ul.l b {
        color: var(--ink);
        font-weight: 600;
      }
      ul.l .src {
        display: block;
        margin-top: 4px;
        font-family: var(--mono);
        font-size: 10.5px;
        color: var(--soft);
      }
      ol.gate {
        list-style: none;
        counter-reset: g;
        column-count: 2;
        column-gap: 34px;
        font-size: 13px;
      }
      ol.gate li {
        counter-increment: g;
        position: relative;
        padding: 0 0 11px 26px;
        color: var(--muted);
        break-inside: avoid;
      }
      ol.gate li::before {
        content: counter(g);
        position: absolute;
        left: 0;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--soft);
        top: 2px;
      }
      @media (max-width: 900px) {
        ol.gate {
          column-count: 1;
        }
      }

      .card {
        background: var(--white);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 18px 20px;
        margin-top: 20px;
        max-width: 74ch;
      }
      .card p {
        color: var(--muted);
      }
      .card b {
        color: var(--ink);
      }
      .term {
        background: var(--ink);
        border-radius: 6px;
        padding: 16px 18px;
        overflow-x: auto;
        margin-top: 8px;
      }
      .term pre {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
        color: #e8eaef;
        white-space: pre;
      }
      pre.code {
        background: var(--white);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 16px 18px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.2px;
        line-height: 1.72;
        margin-top: 8px;
      }
      .k {
        color: #8250c8;
      }
      .s {
        color: #3f7a4c;
      }
      .c {
        color: var(--soft);
        font-style: italic;
      }
      .t {
        color: #8a6a1c;
      }
      .f {
        color: #2e5aa8;
      }
      .num {
        color: #b23c3c;
      }
      .aside {
        font-family: var(--serif);
        font-style: italic;
        font-size: 16px;
        color: var(--muted);
        max-width: 60ch;
        margin-top: 22px;
      }
    </style>
  </head>
  <body>
    <aside id="rail">
      <div class="top">
        <h1>IMPORT</h1>
        <button id="grip" type="button" aria-label="Collapse">
          <svg
            width="16"
            height="16"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9.5 4.5 6 8l3.5 3.5" />
          </svg>
        </button>
      </div>
      <nav><div id="nav"></div></nav>
      <div class="foot">CLOSED · 6/6<br />← → 1–9 · [</div>
    </aside>

    <main>
      <!--BODY-->
    </main>

    <!--DATA-->
    <script>
      (function(){
      var KW=/^(const|let|await|async|return|if|else|for|of|in|new|export|continue|true|false|undefined|Set|Map|Date)$/;
      function hl(src){
        var out="",re=/(\/\/[^\n]*)|(`(?:[^`\\]|\\.)*`|"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d[\w.]*\b)|([A-Za-z_$][\w$]*)|([^\w\s])/g,m,last=0;
        while((m=re.exec(src))){
          out+=esc(src.slice(last,m.index));last=re.lastIndex;
          if(m[1])out+='<span class="c">'+esc(m[1])+'</span>';
          else if(m[2])out+='<span class="s">'+esc(m[2])+'</span>';
          else if(m[3])out+='<span class="num">'+m[3]+'</span>';
          else if(m[4]){var w=m[4],nx=src[re.lastIndex];
            if(KW.test(w))out+='<span class="k">'+w+'</span>';
            else if(/^[A-Z]/.test(w))out+='<span class="t">'+w+'</span>';
            else if(nx==="("||nx==="<")out+='<span class="f">'+w+'</span>';
            else out+=w;}
          else out+=esc(m[5]);
        }
        return out+esc(src.slice(last));
      }
      function esc(s){return s.replace(/&(?!lt;|gt;|amp;)/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
      document.getElementById("c1").innerHTML=hl(document.getElementById("p1").textContent);
      document.getElementById("c2").innerHTML=hl(document.getElementById("p2").textContent);
      document.getElementById("c3").innerHTML=document.getElementById("p3").textContent
        .replace(/( {2,})([a-z].*)$/gm,function(_,s,t){return s+'<span style="color:#7a8399">'+t+'</span>'});
      document.getElementById("c4").textContent=document.getElementById("p4").textContent;

      var G=/*NAV*/;
      var nav=document.getElementById("nav"),html="";
      G.forEach(function(g){
        html+='<div class="grp">'+g[0]+'</div>';
        g[1].forEach(function(s){
          html+='<button type="button" data-i="'+s[1]+'" aria-current="'+(s[1]===0)+'" title="'+s[0]+
            '"><span class="n">'+(s[1]+1)+'</span><span class="lbl">'+s[0]+'</span></button>';
        });
      });
      nav.innerHTML=html;
      var btns={},secs=[].slice.call(document.querySelectorAll("section")),cur=0;
      [].forEach.call(nav.querySelectorAll("button"),function(b){btns[+b.dataset.i]=b});
      function go(i){
        if(i<0||i>=secs.length||i===cur)return;
        secs[cur].classList.remove("on");btns[cur].setAttribute("aria-current","false");
        cur=i;secs[i].classList.add("on");btns[i].setAttribute("aria-current","true");
        window.scrollTo(0,0);
      }
      nav.addEventListener("click",function(e){var b=e.target.closest("button");if(b)go(+b.dataset.i)});
      document.getElementById("grip").addEventListener("click",function(){
        document.body.classList.toggle("collapsed")});
      document.addEventListener("keydown",function(e){
        if(e.metaKey||e.ctrlKey||e.altKey)return;
        if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1);
        else if(e.key==="[")document.body.classList.toggle("collapsed");
        else if(e.key>="1"&&e.key<="9")go(+e.key-1);
      });
      })();
    </script>
  </body>
</html>
